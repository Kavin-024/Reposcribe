worker_processes auto;

events { worker_connections 1024; }

http {
  include mime.types;
  default_type application/octet-stream;
  sendfile on;

  # Docker's embedded DNS. Using this + a variable in proxy_pass forces
  # Nginx to resolve upstream hostnames at REQUEST time, not just once at
  # startup — so it survives containers starting in a different order or
  # restarting independently, instead of crash-looping on "host not found".
  resolver 127.0.0.11 valid=10s;

  # Basic rate limiting in front of the gateway's own limiter (defense in depth).
  limit_req_zone $binary_remote_addr zone=jobs:10m rate=10r/m;

  server {
    listen 80;
    server_name _;

    set $frontend_upstream http://frontend:80;
    set $gateway_upstream http://gateway:4000;

    location / {
      proxy_pass $frontend_upstream;
      proxy_set_header Host $host;
    }

    location /api/jobs {
      limit_req zone=jobs burst=5 nodelay;
      proxy_pass $gateway_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
      proxy_pass $gateway_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /socket.io/ {
      proxy_pass $gateway_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }
  }
}