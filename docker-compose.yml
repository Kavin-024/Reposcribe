services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: ./backend/.env
    expose:
      - "8000"
    restart: unless-stopped

  gateway:
    build: ./gateway
    env_file: ./gateway/.env
    environment:
      - REDIS_URL=redis://redis:6379
      - BACKEND_URL=http://backend:8000
    depends_on:
      - redis
      - backend
    expose:
      - "4000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - gateway
    expose:
      - "80"

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - gateway
      - frontend
    restart: unless-stopped
